<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日快乐</title>
<style>
@font-face{font-family:'MSZ';src:url('msz.woff2') format('woff2')}
@font-face{font-family:'GV';src:url('gv.woff2') format('woff2')}
html,body{margin:0;height:100%;background:#12050f;overflow:hidden}
body{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif}
#view{position:fixed;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:50% 50%;background:#12050f}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
#bg{position:absolute;inset:-60px;background:
  radial-gradient(ellipse 60% 55% at 22% 18%,rgba(186,120,255,.75),rgba(186,120,255,0) 70%),
  radial-gradient(ellipse 55% 50% at 80% 30%,rgba(255,120,200,.85),rgba(255,120,200,0) 70%),
  radial-gradient(ellipse 70% 45% at 30% 95%,rgba(255,226,170,.8),rgba(255,226,170,0) 70%),
  linear-gradient(160deg,#c98cf0,#f39ad6 45%,#f7b7d9 75%,#fbd9c4)}
#dark{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 45%,#3d1032,#12050f 75%);opacity:0}
#hb{position:absolute;left:0;right:0;top:360px;text-align:center;pointer-events:none}
#hb .zh{font-family:'MSZ',serif;font-size:250px;letter-spacing:40px;color:#e3195e;line-height:1;text-shadow:0 6px 24px rgba(160,0,60,.25)}
#hb .en{font-family:'GV',cursive;font-size:120px;color:#d81b60;margin-top:-50px;line-height:1;opacity:.92}
#btn{position:absolute;left:810px;top:820px;width:300px;height:76px;border-radius:40px;background:rgba(255,255,255,.88);box-shadow:0 10px 30px rgba(170,40,120,.25);display:grid;place-items:center;font-size:30px;font-weight:600;color:#c2185b;letter-spacing:3px}
#ripple{position:absolute;left:960px;top:858px;width:0;height:0;border-radius:50%;border:4px solid rgba(255,255,255,.9);transform:translate(-50%,-50%);opacity:0}
#cards{position:absolute;inset:0}
.pc{position:absolute;left:0;top:0;width:320px;height:150px;margin:-75px 0 0 -160px;border-radius:16px;box-sizing:border-box;padding:0 18px;
  box-shadow:0 6px 18px rgba(120,30,90,.18),inset 0 0 0 1.5px rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b2f4a;will-change:transform}
.pc .t{font-size:29px;font-weight:700;white-space:nowrap;letter-spacing:1px}
.pc .s{font-size:17px;color:rgba(60,60,90,.55);margin-top:6px;white-space:nowrap}
.pc .h{position:absolute;left:16px;top:12px;font-size:22px;color:rgba(60,60,90,.55)}
.pc .x{position:absolute;right:16px;top:9px;font-size:24px;color:rgba(60,60,90,.55)}
#pack{position:absolute;left:960px;top:540px;width:420px;height:560px;margin:-280px 0 0 -210px;border-radius:18px;background:#000 url('pack.jpg') center/cover;opacity:0;
  box-shadow:0 0 0 3px rgba(255,225,240,.8),0 0 90px rgba(255,150,220,.9),0 0 200px rgba(255,120,200,.5)}
#rays{position:absolute;left:960px;top:540px;width:1800px;height:1800px;margin:-900px 0 0 -900px;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,220,240,.22) 0deg 6deg,rgba(255,220,240,0) 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%)}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffd6ea 40%,rgba(255,170,210,0) 75%);opacity:0;pointer-events:none}
#win{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:50}#win.on{pointer-events:auto}
#win iframe{width:100%;height:100%;border:0;display:block;background:#000}#btn{cursor:pointer}
.cap{position:absolute;left:0;right:0;text-align:center;font-family:'MSZ',serif;white-space:nowrap;opacity:0;pointer-events:none;color:#fff;
  text-shadow:0 0 18px rgba(0,0,0,.9),0 0 40px rgba(255,140,200,.55)}
#t3{top:400px;font-size:110px;letter-spacing:8px}
#t3 b{font-family:Georgia,'Times New Roman',serif;font-weight:700;color:#ffd98a;font-size:150px;padding:0 6px}
#t4{top:120px;font-size:120px;letter-spacing:10px}
#t4 b{font-weight:400;background:linear-gradient(90deg,#ff7ab8,#ffe08a,#9fffe0,#9fc4ff,#e0a6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,170,220,.85)) brightness(1.15)}
</style>
</head>
<body>
<div id="win"><iframe id="fr" title="生日卡包" allow="autoplay"></iframe></div>
<div id="view">
  <div id="stage">
    <div id="bg"></div>
    <div id="dark"></div>
    <div id="hb"><div class="zh">生日快乐</div><div class="en">Happy Birthday</div></div>
    <div id="btn">轻触开启惊喜 ♡</div>
    <div id="ripple"></div>
    <div id="rays"></div>
    <div id="cards"></div>
    <div id="pack"></div>
  </div>
  <div id="t3" class="cap">全世界只有 <b>1</b> 包</div>
  <div id="t4" class="cap">最后一张 · <b>隐藏款</b></div>
  <div id="flash"></div>
</div>
<script>
const Q = new URLSearchParams(location.search), REC = Q.has('rec');
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x, c = 1.7) => { x = clamp(x); const c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#view').style.transform = `translate(-50%,-50%) scale(${s})`; }
fit(); addEventListener('resize', fit);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// 祝福弹窗
const WORDS = [['生日快乐', '天天开心'], ['岁岁平安', '年年有今日'], ['今天你最大', '心想事成'], ['愿你一直闪闪发光', ''], ['所有的期待都如愿', ''],
  ['新的一岁也要被偏爱', ''], ['好运常在', '万事顺遂'], ['今天是属于你的日子', '生日快乐'], ['愿你每天都有好心情', ''], ['被世界温柔以待', ''],
  ['想陪你过每一个生日', ''], ['你值得所有的美好', ''], ['开心到冒泡', '今天不许不开心'], ['许的愿都会实现', '']];
const GRADS = [['#d9f4ff', '#a9e4ff'], ['#ffe7f4', '#ffc4e3'], ['#fff6c9', '#ffe08f'], ['#ece4ff', '#c9b6ff'], ['#d8fff0', '#9eeccf'], ['#ffeede', '#ffcaa8']];
function mk(i, big) {
  const w = big ? ['生日快乐', '送你一包，全世界只有一包的卡'] : WORDS[i % WORDS.length], g = GRADS[Math.floor(rnd() * GRADS.length)];
  const el = document.createElement('div'); el.className = 'pc';
  el.style.background = `linear-gradient(${120 + rnd() * 60}deg,#ffffff 0%,${g[0]} 45%,${g[1]} 100%)`;
  el.innerHTML = `<span class="h">♡</span><span class="x">×</span><div class="t">${w[0]}</div>${w[1] ? `<div class="s">${w[1]}</div>` : ''}`;
  el.style.display = 'none'; $('#cards').appendChild(el); return el;
}
// 爱心路径：按弧长等距取点，从顶部凹口出发，先走左瓣
const HS = 27, HX = 960, HY = 468;
function heart(u) { const s = Math.sin(u); return [16 * s * s * s * HS, -(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * HS]; }
const TAB = []; { let L = 0, prev = heart(0); TAB.push([0, 0]); for (let k = 1; k <= 4000; k++) { const u = -k / 4000 * Math.PI * 2, p = heart(u); L += Math.hypot(p[0] - prev[0], p[1] - prev[1]); prev = p; TAB.push([L, u]); } }
const PERIM = TAB[TAB.length - 1][0], GAP = 14, NH = Math.floor(PERIM / GAP);
function atLen(l) { let lo = 0, hi = TAB.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (TAB[m][0] < l) lo = m; else hi = m; } return heart(TAB[hi][1]); }
const HEART = []; for (let i = 0; i < NH; i++) { const [x, y] = atLen(i * GAP); HEART.push({ el: mk(i), x: HX + x, y: HY + y }); }
// 炸开铺满：网格 + 随机，按随机时间冒出来
const NW = 170, WALL = [];
for (let i = 0; i < NW; i++) {
  const col = i % 9, row = Math.floor(i / 9) % 10;
  const wx = i < 90 ? 60 + col * 225 + (row % 2) * 110 + (rnd() - 0.5) * 70 : 100 + rnd() * 1720;
  const wy = i < 90 ? 40 + row * 112 + (rnd() - 0.5) * 30 : 60 + rnd() * 960;
  WALL.push({ el: mk(i + 5), x: wx, y: wy, s: 0.85 + rnd() * 0.3, born: rnd() });
}
const BIG = mk(0, true); BIG.style.width = '620px'; BIG.style.height = '330px'; BIG.style.margin = '-165px 0 0 -310px';
BIG.querySelector('.t').style.fontSize = '64px'; BIG.querySelector('.s').style.fontSize = '30px'; BIG.querySelector('.s').style.marginTop = '18px';
BIG.style.boxShadow = '0 30px 80px rgba(120,30,90,.35),inset 0 0 0 2px rgba(255,255,255,.9)';

const T_TAP = 0.5, H0 = 0.75, H1 = 4.0, R0 = 4.25, R1 = 5.05, B0 = 4.95, B1 = 5.9, G0 = 5.95, X0 = 6.75, C0 = 7.25;
const fr = $('#fr');
const PQ = new URLSearchParams(location.search), AUTOPLAY = PQ.has('auto');
{ // 卡包页面放进内嵌窗口；名字等参数原样传进去
  const qs = new URLSearchParams(); qs.set('wait', '1'); if (AUTOPLAY) qs.set('auto', '1');
  ['name', 'from', 'msg', 'days', 'theme'].forEach((k) => { if (PQ.get(k)) qs.set(k, PQ.get(k)); });
  fr.src = 'cardpack.html?' + qs.toString();
}
let frReady = false, frGo = false;
addEventListener('message', (e) => { if (e.data === 'cp-ready') frReady = true; });
let t = 0;
function put(el, x, y, sc, rx, rot, op, zi) {
  if (op <= 0.01) { el.style.display = 'none'; return; }
  el.style.display = 'flex'; el.style.opacity = op; el.style.zIndex = zi;
  el.style.transform = `translate(${x}px,${y}px) perspective(1000px) rotateX(${rx}deg) rotate(${rot}deg) scale(${sc})`;
}
function render(dt) {
  t += dt;
  // 虚拟手持：轻微晃动
  const sx = Math.sin(t * 1.3) * 5 + Math.sin(t * 3.1) * 1.5, sy = Math.cos(t * 1.1) * 4 + Math.sin(t * 2.7) * 1.5;
  $('#stage').style.transform = `translate(${sx}px,${sy}px) rotate(${Math.sin(t * 0.9) * 0.3}deg) scale(1.01)`;
  // 按钮 + 点击
  const tapK = prog(t, T_TAP, T_TAP + 0.45);
  $('#ripple').style.opacity = tapK > 0 && tapK < 1 ? 1 - tapK : 0;
  $('#ripple').style.width = $('#ripple').style.height = `${easeOut(tapK) * 220}px`;
  $('#btn').style.transform = `scale(${t < T_TAP ? 1 : 1 - 0.08 * Math.sin(prog(t, T_TAP, T_TAP + 0.2) * Math.PI)})`;
  $('#btn').style.opacity = 1 - ease(prog(t, T_TAP + 0.15, T_TAP + 0.45));
  $('#hb').style.opacity = 1 - ease(prog(t, B1 - 0.3, B1));
  // 爱心：头部沿路径画一圈；之后尾巴追着头往回收（合起来）
  const headF = prog(t, H0, H1) * NH, tailF = prog(t, R0, R1) * NH;
  for (let i = 0; i < NH; i++) {
    const c = HEART[i];
    const born = H0 + (i / NH) * (H1 - H0);
    if (t < born || i > headF || i < tailF - 0.5) { c.el.style.display = 'none'; continue; }
    const k = easeOut(prog(t, born, born + 0.3));
    put(c.el, lerp(c.x + 50, c.x, k), lerp(c.y + 70, c.y, k), lerp(1.15, 1, k), 12, lerp(-4, 0, k), 1, 1000 + i);
  }
  // 炸开：弹窗从四处冒出来铺满
  for (let i = 0; i < NW; i++) {
    const c = WALL[i], b = B0 + c.born * (B1 - B0 - 0.2), k = prog(t, b, b + 0.22);
    if (k <= 0) { c.el.style.display = 'none'; continue; }
    const blur = ease(prog(t, X0, C0));
    put(c.el, c.x, c.y, c.s * (0.6 + 0.4 * back(k, 2.2)) * (1 + 0.15 * blur), 0, 0, clamp(k * 3), 3000 + i);
  }
  // 中间一张大卡
  const g = prog(t, G0, G0 + 0.35);
  put(BIG, 960, 540, back(g, 1.8) * (1 + 0.08 * ease(prog(t, X0, C0))), 0, 0, g > 0 ? 1 : 0, 9000);
  // 虚化切走
  const bl = ease(prog(t, X0, C0));
  $('#cards').style.filter = bl > 0 ? `blur(${bl * 18}px) brightness(${1 - bl * 0.5})` : 'none';
  $('#dark').style.opacity = bl;
  // 切进卡包
  if (t >= C0 - 0.05 && !frGo) { frGo = true; if (!REC) fr.contentWindow.postMessage('go', '*'); }
  const w = $('#win'); w.style.opacity = ease(prog(t, C0 - 0.25, C0 + 0.1));
  if (REC && t >= C0 - 0.25 && fr.contentWindow.__step) fr.contentWindow.__step(dt);
  $('#stage').style.visibility = t >= C0 + 0.15 ? 'hidden' : 'visible';
}
window.__T = () => t;
window.__imgs = () => Promise.resolve();
if (REC) {
  window.__ready = false;
  fr.onload = () => { const chk = () => (fr.contentWindow.__ready ? (window.__ready = true) : setTimeout(chk, 100)); chk(); };
  window.__step = (dt) => render(dt);
  render(0);
} else {
  render(0);
  let started = false;
  const go = () => { if (started || !frReady) return; started = true; let last = performance.now(); t = AUTOPLAY ? 0 : T_TAP - 0.02; const loop = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (t < 13) render(dt); if (t >= C0) $('#win').classList.add('on'); requestAnimationFrame(loop); }; requestAnimationFrame(loop); };
  $('#view').addEventListener('pointerdown', go);
  if (AUTOPLAY) { const wait = () => (frReady ? go() : setTimeout(wait, 100)); wait(); }
}
</script>
</body>
</html>
